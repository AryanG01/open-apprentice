server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_buffering off;          # SSE (spec 25.2)
    proxy_read_timeout 1h;
  }
  location /health/ { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; }
}

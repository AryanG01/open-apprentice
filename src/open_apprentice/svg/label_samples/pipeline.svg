<?xml version="1.0" encoding="UTF-8"?>
<!-- Authored for Open Apprentice (MIT). Pipeline stages: boxes with attached text labels sitting below their box. -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <title>Pipeline stages</title>
  <rect id="bg" x="0" y="0" width="760" height="300" fill="#f6f6f2"/>
  <rect id="n1" x="40" y="40" width="100" height="50" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n2" x="280" y="40" width="100" height="50" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n3" x="520" y="40" width="100" height="50" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n4" x="40" y="170" width="100" height="50" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n5" x="280" y="170" width="100" height="50" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n6" x="520" y="170" width="100" height="50" fill="#dde4d3" stroke="#7d8a6c"/>
  <text id="l1" data-for="n1" data-role="note" x="40" y="106" font-size="12" fill="#33402a">Ingest</text>
  <text id="l2" data-for="n2" data-role="note" x="280" y="106" font-size="12" fill="#33402a">Clean</text>
  <text id="l3" data-for="n3" data-role="warning" x="520" y="106" font-size="12" fill="#33402a">Embed</text>
  <text id="l4" data-for="n4" data-role="note" x="40" y="236" font-size="12" fill="#33402a">Index</text>
  <text id="l5" data-for="n5" data-role="note" x="280" y="236" font-size="12" fill="#33402a">Rank</text>
  <text id="l6" data-for="n6" data-role="warning" x="520" y="236" font-size="12" fill="#33402a">Serve</text>
</svg>

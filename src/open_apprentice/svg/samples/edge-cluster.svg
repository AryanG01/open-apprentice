<?xml version="1.0" encoding="UTF-8"?>
<!-- Authored for Open Apprentice (MIT). Edge cluster: boxes with attached text labels sitting below their box. -->
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320">
  <title>Edge cluster</title>
  <rect id="bg" x="0" y="0" width="560" height="320" fill="#f6f6f2"/>
  <rect id="n1" x="30" y="40" width="90" height="44" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n2" x="140" y="40" width="90" height="44" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n3" x="450" y="40" width="90" height="44" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n4" x="30" y="180" width="90" height="44" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n5" x="150" y="190" width="90" height="44" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n6" x="440" y="200" width="90" height="44" fill="#dde4d3" stroke="#7d8a6c"/>
  <text id="l1" data-for="n1" data-role="note" x="30" y="100" font-size="12" fill="#33402a">Ingress</text>
  <text id="l2" data-for="n2" data-role="note" x="140" y="100" font-size="12" fill="#33402a">Router</text>
  <text id="l3" data-for="n3" data-role="note" x="450" y="100" font-size="12" fill="#33402a">Egress</text>
  <text id="l4" data-for="n4" data-role="warning" x="30" y="240" font-size="12" fill="#33402a">Metrics</text>
  <text id="l5" data-for="n5" data-role="note" x="150" y="250" font-size="12" fill="#33402a">Logs</text>
  <text id="l6" data-for="n6" data-role="note" x="440" y="260" font-size="12" fill="#33402a">Alerts</text>
</svg>

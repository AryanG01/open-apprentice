<?xml version="1.0" encoding="UTF-8"?>
<!-- Authored for Open Apprentice (MIT). Mixed layout: boxes with attached text labels sitting below their box. -->
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330">
  <title>Mixed layout</title>
  <rect id="bg" x="0" y="0" width="700" height="330" fill="#f6f6f2"/>
  <rect id="n1" x="40" y="30" width="100" height="50" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n2" x="200" y="30" width="100" height="50" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n3" x="520" y="30" width="100" height="50" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n4" x="60" y="170" width="100" height="50" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n5" x="360" y="170" width="100" height="50" fill="#dde4d3" stroke="#7d8a6c"/>
  <rect id="n6" x="480" y="250" width="100" height="50" fill="#dde4d3" stroke="#7d8a6c"/>
  <text id="l1" data-for="n1" data-role="note" x="40" y="96" font-size="12" fill="#33402a">Client</text>
  <text id="l2" data-for="n2" data-role="note" x="200" y="96" font-size="12" fill="#33402a">Proxy</text>
  <text id="l3" data-for="n3" data-role="warning" x="520" y="96" font-size="12" fill="#33402a">Queue</text>
  <text id="l4" data-for="n4" data-role="note" x="60" y="236" font-size="12" fill="#33402a">Worker</text>
  <text id="l5" data-for="n5" data-role="note" x="360" y="236" font-size="12" fill="#33402a">Store</text>
  <text id="l6" data-for="n6" data-role="note" x="480" y="316" font-size="12" fill="#33402a">Audit</text>
</svg>
